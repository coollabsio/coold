[workspace]
members = ["coold", "broker", "builder", "builder-core", "e2e-tests", "proto"]
# e2e-tests is a live-server test harness; exclude it from default builds
# so nightly + local `cargo build --workspace` stay fast. Run explicitly
# with `cargo test -p e2e-tests -- --ignored --test-threads=1`.
default-members = ["coold", "broker", "builder", "builder-core", "proto"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "io-util", "process", "fs"] }
tonic = { version = "0.12", features = ["channel"] }
prost = "0.13"
tokio-stream = "0.1"
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
