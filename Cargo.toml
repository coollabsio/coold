[package]
name = "coold"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Per-host Coolify v5 agent: syncs Podman container state to Corrosion over WireGuard mesh."
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "io-util"] }
hyper = { version = "1.4", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
hyperlocal = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
bytes = "1"
humantime = "2"
futures-util = "0.3"
async-trait = "0.1"
hickory-server = "0.24"
hickory-proto = "0.24"
hickory-resolver = "0.24"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
