[package]
name = "builder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Coolify v5 build agent: short-lived subprocess that executes one OCI image build per invocation."
license.workspace = true

[[bin]]
name = "builder"
path = "src/main.rs"

[dependencies]
builder-core = { path = "../builder-core" }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = "0.2"
