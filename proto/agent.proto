syntax = "proto3";
package coolify.agent.v1;

// Flux is the gRPC server. coold dials the flux and opens this stream.
// Flow: coold → ClientMsg (Hello first, then Responses).
//       flux → ServerMsg (Commands with request_id).
service Agent {
    rpc Stream(stream ClientMsg) returns (stream ServerMsg);
}

message ClientMsg {
    oneof payload {
        Hello hello = 1;
        Response response = 2;
        ResourceStatusUpdate resource_status_update = 3;
    }
}

message Hello {
    string host_mgmt_ip = 1;
    string coold_version = 2;
    uint32 schema_min = 3;
    uint32 schema_max = 4;
    repeated string capabilities = 5;
}

message ServerMsg {
    string request_id = 1;
    oneof command {
        ImagesPullReq images_pull = 10;
        ImagesListReq images_list = 11;
        ImagesDeleteReq images_delete = 12;

        ContainersCreateReq containers_create = 20;
        ContainersStartReq containers_start = 21;
        ContainersStopReq containers_stop = 22;
        ContainersRestartReq containers_restart = 23;
        ContainersDeleteReq containers_delete = 24;
        ContainersInspectReq containers_inspect = 25;
        ContainersListReq containers_list = 26;
        ContainersLogsReq containers_logs = 27;
        ContainersExecReq containers_exec = 28;
        ContainersHealthcheckRunReq containers_healthcheck_run = 29;

        ApplyIngressReq ingress_apply = 90;
        StopIngressReq  ingress_stop  = 91;
    }
}

message Response {
    string request_id = 1;
    oneof body {
        ImagesPullResp images_pull = 10;
        ImagesListResp images_list = 11;
        ImagesDeleteResp images_delete = 12;

        ContainersCreateResp containers_create = 20;
        ContainersStartResp containers_start = 21;
        ContainersStopResp containers_stop = 22;
        ContainersRestartResp containers_restart = 23;
        ContainersDeleteResp containers_delete = 24;
        ContainersInspectResp containers_inspect = 25;
        ContainersListResp containers_list = 26;
        ContainersLogsResp containers_logs = 27;
        ContainersExecResp containers_exec = 28;
        ContainersHealthcheckRunResp containers_healthcheck_run = 29;

        ApplyIngressResp ingress_apply = 90;
        StopIngressResp  ingress_stop  = 91;
        Error error = 100;
    }
}

message ResourceStatusUpdate {
    string resource_type = 1;
    string host_id = 2;
    string container_id = 3;
    string container_name = 4;
    string status = 5;
    string status_message = 6;
}

message Error {
    uint32 code = 1;
    string message = 2;
}

message ImagesPullReq { string reference = 1; }
message ImagesPullResp { string digest = 1; string output = 2; }
message ImagesListReq {}
message ImagesDeleteReq { string reference = 1; bool force = 2; }
message ImagesDeleteResp { string output = 1; }

message ImageSummary {
    string id = 1;
    repeated string repo_tags = 2;
    repeated string repo_digests = 3;
    int64 size = 4;
    string created = 5;
}
message ImagesListResp { repeated ImageSummary images = 1; }

message PortMapping {
    string host_ip = 1;
    uint32 host_port = 2;
    uint32 container_port = 3;
    string protocol = 4;
}

message ContainersCreateReq {
    string name = 1;
    string image = 2;
    repeated string command = 3;
    repeated string env = 4;
    repeated string networks = 5;
    repeated string volumes = 6;
    repeated PortMapping ports = 7;
    repeated string dns = 8;
    string restart_policy = 9;

    bool privileged = 20;
    string network_mode = 21;
    repeated string capabilities = 22;
}
message ContainersCreateResp { string id = 1; }
message ContainersStartReq { string id = 1; }
message ContainersStartResp { string output = 1; }
message ContainersStopReq { string id = 1; uint32 timeout_seconds = 2; }
message ContainersStopResp { string output = 1; }
message ContainersRestartReq { string id = 1; uint32 timeout_seconds = 2; }
message ContainersRestartResp { string output = 1; }
message ContainersDeleteReq { string id = 1; bool force = 2; }
message ContainersDeleteResp { string output = 1; }
message ContainersInspectReq { string id = 1; }
message ContainersInspectResp { string json = 1; }
message ContainersListReq {}
message ContainersLogsReq { string id = 1; uint32 tail = 2; bool stdout = 3; bool stderr = 4; }
message ContainersLogsResp { string output = 1; }
message ContainersExecReq { string id = 1; repeated string command = 2; }
message ContainersExecResp { int32 exit_code = 1; string output = 2; }
message ContainersHealthcheckRunReq { string id = 1; }
message ContainersHealthcheckRunResp { string output = 1; }

message ContainerSummary {
    string id = 1;
    string name = 2;
    string image = 3;
    string state = 4;
    repeated string networks = 5;
}
message ContainersListResp { repeated ContainerSummary containers = 1; }

message ApplyIngressReq {
    string kind = 1;
    string config = 2;
    string mesh_network = 3;
    repeated IngressAppConfig apps = 4;
}

message IngressAppConfig {
    string name = 1;
    string config = 2;
}

message ApplyIngressResp { string output = 1; }
message StopIngressReq { string kind = 1; }
message StopIngressResp { string output = 1; }
