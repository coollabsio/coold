syntax = "proto3";
package coolify.builder.v1;

// builder dials broker and opens this stream (mirrors coold's Agent.Stream).
// Flow: builder → BuilderClientMsg (Hello first, then Progress/Response).
//       broker → BuilderServerMsg (BuildRequest or CancelBuild with request_id).
service Builder {
    rpc Stream(stream BuilderClientMsg) returns (stream BuilderServerMsg);
}

message BuilderClientMsg {
    oneof payload {
        BuilderHello    hello    = 1;
        BuildProgress   progress = 2;
        BuildResponse   response = 3;
    }
}

message BuilderHello {
    string builder_id      = 1;
    string builder_version = 2;
    uint32 capacity        = 3;  // concurrent build slots
}

message BuilderServerMsg {
    string request_id = 1;
    oneof command {
        BuildRequest build  = 10;
        CancelBuild  cancel = 11;
    }
}

enum BuildStack {
    BUILD_STACK_UNSPECIFIED = 0;
    DOCKERFILE              = 1;
    BUILDPACKS              = 2;
    RAILPACK                = 3;
    STATIC                  = 4;
}

message BuildRequest {
    string   repo_url        = 1;
    string   git_ref         = 2;  // commit sha preferred
    BuildStack stack         = 3;
    string   target_image    = 4;  // e.g. localhost/app-42
    string   cache_key       = 5;
    StaticConfig static_cfg  = 20;
}

message StaticConfig {
    string output_dir = 1;  // relative to repo root; default "dist"
    string base_image = 2;  // default: docker.io/library/nginx:alpine
}

message CancelBuild {}

message BuildProgress {
    string stage    = 1;  // "git" | "detect" | "build" | "store"
    string log_line = 2;
    uint32 percent  = 3;  // best-effort 0-100
}

message BuildResponse {
    string request_id = 1;  // echoed from BuilderServerMsg.request_id
    oneof body {
        BuildResult ok  = 10;
        BuildError  err = 11;
    }
}

message BuildResult {
    string     digest       = 1;  // sha256:...
    string     registry_ref = 2;  // localhost/<app>@sha256:...
    uint64     duration_ms  = 3;
    BuildStack stack_used   = 4;
}

message BuildError {
    uint32 code    = 1;
    string message = 2;
    string stage   = 3;
}
