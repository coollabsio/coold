[package]
name = "flux"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Flux gRPC stream router: terminates coold streams, exposes HTTP-over-UDS dispatch to the central plane."
license.workspace = true

[[bin]]
name = "flux"
path = "src/main.rs"

[dependencies]
proto = { path = "../proto" }
tokio = { workspace = true }
# S1: `tls` enables optional defense-in-depth TLS on the gRPC listener (off by
# default; runtime-gated on COOLIFY_FLUX_TLS_CERT_PATH/KEY_PATH). The workspace
# tonic enables `channel`; features are additive so this keeps that.
tonic = { workspace = true, features = ["tls"] }
prost = { workspace = true }
tokio-stream = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = "9"
axum = "0.7"
tower = "0.5"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "sign_jwt"
